<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="logo">Tech Blog Search Engine</h1>
            <p class="subtitle">IT 기업 테크블로그 콘텐츠 검색 엔진</p>
            <p class="companies">FAANG, 네카라쿠배 등 30+ 기업</p>
            <p class="feature-info"></p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="검색어를 입력하세요"
                    autocomplete="off">
                <button id="searchBtn">검색</button>
            </div>

            <div id="autocomplete" class="autocomplete-dropdown"></div>

            <div id="searchInfo" class="search-info" style="display: none;"></div>

            <div id="loading" class="loading" style="display: none;">
                검색 중...
            </div>

            <div id="results" class="results"></div>
        </main>

        <footer>
            <p class="footer-text">
                💡 <strong>TIP:</strong> 한영변환 (rnrmf → 구글), 초성검색 (ㅌㅅㅌ → 테스트), 오타교정 (개발저 → 개발자)
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
